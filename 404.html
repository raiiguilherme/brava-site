<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Brava Agência de Conteúdo</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#52021f">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --vinho:#52021f; --creme:#f5e2d2; --lima:#b3a739; --rosa:#e0a9c0; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:grid; place-items:center; text-align:center; padding:32px 22px;
      background:radial-gradient(circle at 50% 40%, rgba(224,169,192,.22), transparent 62%), var(--vinho);
      color:var(--creme); font-family:'Poppins', system-ui, sans-serif; -webkit-font-smoothing:antialiased;
    }
    img { width:min(260px,64vw); height:auto; display:block; margin:0 auto 36px; }
    .code { font-family:'Fraunces', Georgia, serif; font-weight:900; font-size:clamp(5rem,22vw,9rem); line-height:1; color:var(--lima); }
    h1 { font-family:'Fraunces', Georgia, serif; font-weight:900; font-size:clamp(1.6rem,5vw,2.4rem); margin:14px 0 12px; }
    p { color:rgba(245,226,210,.72); max-width:34ch; margin:0 auto 32px; line-height:1.6; }
    a.btn {
      display:inline-block; padding:14px 30px; border-radius:999px; background:var(--creme); color:var(--vinho);
      font-weight:600; font-size:13px; letter-spacing:2px; text-transform:uppercase; text-decoration:none;
    }
    a.btn:hover, a.btn:focus-visible { background:var(--rosa); }
  </style>
</head>

<body>
  <main>
    <img src="/assets/logo-brava.png" width="1235" height="420" alt="Brava — Conteúdo que provoca.">
    <div class="code" aria-hidden="true">404</div>
    <h1>Essa página não existe.</h1>
    <p>Mas a sua marca pode existir (e provocar). Volte para a página inicial e veja o que a Brava faz.</p>
    <a class="btn" href="/">Voltar ao início</a>
  </main>
</body>

</html>
